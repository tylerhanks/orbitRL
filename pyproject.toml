[project]
name = "orbitrl"
version = "0.1.0"
description = "Learning to play OrbitXL with reinforcement learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "esper>=3.7",
    "numpy>=2.4.4",
    "pygame-ce>=2.5.7",
    "pygame-gui>=0.6.14",
]

[project.scripts]
orbitrl = "orbitrl.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
